<!doctype html>
<!-- Prototype: the satellite/render mode drawn with Three.js instead of ArcGIS,
     to compare performance on low-end phones. Isolated from the visor; served
     at /maqueta (see vite.config.js) and fed by the same ?data= URL. -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prototipo — maqueta Three.js</title>
  <style>
    :root { --accent: #c5a059; --ink: #1f2937; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f1ec; font-family: system-ui, sans-serif; color: var(--ink); }
    canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f3f1ec; font-size: 15px; z-index: 10; transition: opacity .4s; }
    #loading.done { opacity: 0; pointer-events: none; }

    #modes { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.92); box-shadow: 0 4px 18px rgba(0,0,0,.18); z-index: 5; }
    #modes button { border: 0; padding: 8px 16px; border-radius: 999px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; }
    #modes button.on { background: var(--ink); color: #fff; }

    /* Perf readout: what we're actually here to compare against ArcGIS. */
    /* Map credits: OSM's license (ODbL) and Esri's terms both require them on screen. */
    #attrib { position: fixed; right: 0; bottom: env(safe-area-inset-bottom, 0px); padding: 2px 8px; border-top-left-radius: 6px; background: rgba(255,255,255,.75); color: #4b5563; font-size: 11px; z-index: 5; }
    #attrib a { color: inherit; }

    #hud { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 8px 10px; border-radius: 8px; background: rgba(17,24,39,.82); color: #e5e7eb; font: 12px/1.45 ui-monospace, monospace; white-space: pre; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="modes">
    <button type="button" data-mode="satellite">Satélite</button>
    <button type="button" data-mode="render">Render</button>
  </div>
  <div id="hud"></div>
  <div id="attrib"></div>
  <div id="loading">Cargando…</div>
  <script type="module" src="/design-lab/maqueta.js"></script>
</body>
</html>
